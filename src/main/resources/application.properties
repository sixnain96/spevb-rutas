spring.application.name=spevb-rutas
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spevb}
spring.datasource.username=${DB_USER:spevb}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
spring.jackson.serialization.indent-output=true
server.error.include-message=never

# Documentación OpenAPI y referencia interactiva Scalar.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/scalar
scalar.pageTitle=SPEVB Rutas - Documentación API

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10

spevb.editor.enabled=${EDITOR_ENABLED:false}
spevb.limite.habilitado=${LIMITE_SOLICITUDES:true}
spevb.editor.token=${EDITOR_TOKEN:}

# La aplicación está deliberadamente acotada a Villavicencio.
spevb.city.name=Villavicencio
spevb.city.region=Meta
spevb.city.country=Colombia
spevb.city.min-lat=${CITY_MIN_LAT:3.95}
spevb.city.max-lat=${CITY_MAX_LAT:4.35}
spevb.city.min-lng=${CITY_MIN_LNG:-73.85}
spevb.city.max-lng=${CITY_MAX_LNG:-73.45}

# Proveedor compatible con Nominatim. Se puede reemplazar por una instancia propia.
spevb.geocoder.url=${GEOCODER_URL:https://nominatim.openstreetmap.org/search}
spevb.geocoder.reverse-url=${GEOCODER_REVERSE_URL:https://nominatim.openstreetmap.org/reverse}
spevb.geocoder.user-agent=${GEOCODER_USER_AGENT:SPEVB-Rutas/3.0}

# Direcciones catastrales municipales: geometría de predio (NO entrada ni puerta).
spevb.catastro.url=${VILLAVO_CATASTRO_URL:https://services7.arcgis.com/c0V1cyhKZwmv8Gtf/ArcGIS/rest/services/U_TERRENO/FeatureServer/1/query}
# ArcGIS profesional es opcional. No guardar los resultados de sus consultas en PostgreSQL.
spevb.arcgis.url=${ARCGIS_GEOCODE_URL:https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates}
spevb.arcgis.token=${ARCGIS_API_KEY:}

# Rendimiento: compresión y caché de archivos estáticos.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
# El código propio se revalida (304 si no cambió); Leaflet usa caché largo (ver WebCacheConfig).
spring.web.resources.cache.cachecontrol.no-cache=true

# Trayecto a pie por calles (OSRM perfil peatonal sobre OpenStreetMap). Vacío = solo línea recta.
spevb.walking.url=${WALKING_URL:https://routing.openstreetmap.de/routed-foot/route/v1/foot}

# Base propia de direcciones (V3.6): se importa sola del catastro al primer arranque y se refresca cada N días.
spevb.direcciones.import-on-start=${DIRECCIONES_IMPORT_AL_ARRANCAR:true}
spevb.direcciones.refresh-days=${DIRECCIONES_REFRESCO_DIAS:30}

# Lugares con nombre desde OpenStreetMap (Overpass). Se prueba cada servidor en orden hasta que uno responda.
spevb.osm.overpass-urls=${OVERPASS_URLS:https://overpass-api.de/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter,https://overpass.private.coffee/api/interpreter}
spevb.osm.import-on-start=${OSM_IMPORT_AL_ARRANCAR:true}
spevb.osm.refresh-days=${OSM_REFRESCO_DIAS:30}

# Red peatonal propia (V3.4+): calles y andenes de OpenStreetMap en memoria. Los trayectos a pie se calculan aquí
# (sin cuotas ni servidor externo); OSRM queda como respaldo. El archivo guarda la descarga para no repetirla.
spevb.red.enabled=${RED_PEATONAL_HABILITADA:true}
spevb.red.cache-file=${RED_PEATONAL_ARCHIVO:data/red-peatonal.bin.gz}
spevb.red.refresh-days=${RED_PEATONAL_REFRESCO_DIAS:60}
