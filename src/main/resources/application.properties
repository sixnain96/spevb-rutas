spring.application.name=spevb-rutas
# Versión única del proyecto: la filtra Maven desde pom.xml (ver también META-INF/build-info.properties).
spevb.version=@project.version@
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spevb}
spring.datasource.username=${DB_USER:spevb}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo gestiona Flyway (src/main/resources/db/migration). Ya no se ejecuta schema.sql/data.sql en cada arranque.
# baseline-on-migrate: una base creada antes por schema.sql (sin historial de Flyway) se adopta sin tocar sus datos; las
# migraciones son idempotentes. Los datos demostrativos (db/demo) solo se cargan con DEMO_DATA=true (ver DemoDataFlywayConfig).
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.ignore-migration-patterns=repeatable:missing
spevb.demo-data=${DEMO_DATA:false}
spring.jackson.serialization.indent-output=true
server.error.include-message=never

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10

spevb.editor.enabled=${EDITOR_ENABLED:false}
spevb.limite.habilitado=${LIMITE_SOLICITUDES:true}
spevb.editor.token=${EDITOR_TOKEN:}

# La aplicación está deliberadamente acotada a Villavicencio.
spevb.city.name=Villavicencio
spevb.city.region=Meta
spevb.city.country=Colombia
spevb.city.min-lat=${CITY_MIN_LAT:3.95}
spevb.city.max-lat=${CITY_MAX_LAT:4.35}
spevb.city.min-lng=${CITY_MIN_LNG:-73.85}
spevb.city.max-lng=${CITY_MAX_LNG:-73.45}

# 4.14: la búsqueda de direcciones y lugares del pasajero es EXCLUSIVAMENTE Google (ver spevb.google-maps.* más abajo).
# Nominatim queda APAGADO (URL vacía) y ningún flujo del pasajero lo consulta; solo se activaría si alguien define estas variables a propósito.
spevb.geocoder.url=${GEOCODER_URL:}
spevb.geocoder.reverse-url=${GEOCODER_REVERSE_URL:}
spevb.geocoder.user-agent=${GEOCODER_USER_AGENT:SEVB-Rutas/4.10}

# Direcciones catastrales municipales: geometría de predio (NO entrada ni puerta).
spevb.catastro.url=${VILLAVO_CATASTRO_URL:https://services7.arcgis.com/c0V1cyhKZwmv8Gtf/ArcGIS/rest/services/U_TERRENO/FeatureServer/1/query}
# ArcGIS profesional es opcional. No guardar los resultados de sus consultas en PostgreSQL.
spevb.arcgis.url=${ARCGIS_GEOCODE_URL:https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates}
spevb.arcgis.token=${ARCGIS_API_KEY:}

# Rendimiento: compresión y caché de archivos estáticos.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
# El código propio se revalida (304 si no cambió); Leaflet usa caché largo (ver WebCacheConfig).
spring.web.resources.cache.cachecontrol.no-cache=true

# Trayecto a pie por calles (OSRM perfil peatonal sobre OpenStreetMap). Vacío = solo línea recta.
spevb.walking.url=${WALKING_URL:https://routing.openstreetmap.de/routed-foot/route/v1/foot}

# Base propia de direcciones (V3.6). 4.14: la importación AUTOMÁTICA del catastro queda APAGADA (la búsqueda del pasajero ya no usa esa base).
# Los datos ya cargados no se borran; la importación manual del administrador sigue disponible (lugares.html).
spevb.direcciones.import-on-start=${DIRECCIONES_IMPORT_AL_ARRANCAR:false}
spevb.direcciones.refresh-days=${DIRECCIONES_REFRESCO_DIAS:30}

# Overpass: sirve a la red peatonal y vial (routing, SIGUEN activas). Solo la importación de LUGARES/DIRECCIONES (OsmImportService) se apaga aquí en 4.14.
spevb.osm.overpass-urls=${OVERPASS_URLS:https://overpass-api.de/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter,https://overpass.private.coffee/api/interpreter}
spevb.osm.import-on-start=${OSM_IMPORT_AL_ARRANCAR:false}
spevb.osm.refresh-days=${OSM_REFRESCO_DIAS:30}

# Red peatonal propia (V3.4+): calles y andenes de OpenStreetMap en memoria. Los trayectos a pie se calculan aquí
# (sin cuotas ni servidor externo); OSRM queda como respaldo. El archivo guarda la descarga para no repetirla.
spevb.red.enabled=${RED_PEATONAL_HABILITADA:true}
spevb.red.cache-file=${RED_PEATONAL_ARCHIVO:data/red-peatonal.bin.gz}
spevb.red.refresh-days=${RED_PEATONAL_REFRESCO_DIAS:60}

# Red vial para BUSES (separada de la peatonal): solo vías vehiculares según las reglas de co.edu.usta.spevb.vial.ReglasBus.
# Sirve para ajustar recorridos al mapa; "transitable según la red disponible" NO es una autorización oficial.
spevb.vial.enabled=${RED_VIAL_HABILITADA:true}
spevb.vial.cache-file=${RED_VIAL_ARCHIVO:data/red-vial-bus.json.gz}
spevb.vial.refresh-days=${RED_VIAL_REFRESCO_DIAS:60}
spevb.vial.max-snap-metros=${RED_VIAL_MAX_SNAP_METROS:30}
# Servidor OSRM /match opcional (vacío = desactivado; nunca recibe credenciales).
spevb.vial.matching-url=${BUS_MATCHING_URL:}

# Inicio de sesión con Google (opcional). Sin GOOGLE_CLIENT_ID el botón no aparece. Ver docs/GOOGLE.md.
spevb.google.client-id=${GOOGLE_CLIENT_ID:}
spevb.google.jwks-url=${GOOGLE_JWKS_URL:https://www.googleapis.com/oauth2/v3/certs}
spevb.admin.correos=${ADMIN_CORREOS:}

# Google Maps (OPCIONAL, apagado si la clave está vacía). Solo direcciones: autocompletado y detalle del lugar (Places API «New»). Ver docs/GOOGLE-MAPS.md.
spevb.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}
spevb.google-maps.url=${GOOGLE_MAPS_URL:https://places.googleapis.com}
# Clave de Google Maps JavaScript API para el NAVEGADOR (mapa base). Distinta de la del servidor; PÚBLICA por diseño: restríngela por dominio. Vacía = mapa de respaldo.
spevb.google-maps.browser-key=${GOOGLE_MAPS_BROWSER_KEY:${GOOGLE_MAPS_BROWSER_API_KEY:}}
# ID de mapa de Google (opcional, estilo propio / mapa vectorial). Público.
spevb.google-maps.map-id=${GOOGLE_MAPS_MAP_ID:}
