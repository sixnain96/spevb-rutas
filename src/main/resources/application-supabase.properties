# Perfil «supabase»: ajustes del pool y del driver para una base REMOTA (Supabase, Session pooler). Se activa solo si DB_URL apunta a Supabase
# (ver SpevbRutasApplication) o con SPRING_PROFILES_ACTIVE=supabase. Con la base local de Docker este archivo no se usa y todo queda como antes.
# Medición y razones: docs/RENDIMIENTO-DB.md.

# Conexiones: el Session pooler de Supabase da un número limitado de conexiones al servidor por proyecto (cada cliente retiene una).
# HikariCP por defecto mantiene SIEMPRE abiertas tantas conexiones como el máximo (10): dos copias de la aplicación (desarrollo + producción) ya
# gastarían 20. Aquí el máximo sigue siendo 10 (misma capacidad de atender usuarios a la vez que antes), pero solo 5 quedan siempre abiertas;
# las demás se abren cuando hacen falta y se cierran tras 5 min sin uso. Se pueden cambiar con DB_POOL_MAX y DB_POOL_MIN.
spring.datasource.hikari.pool-name=SEVB-Supabase
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
# Las conexiones por encima del mínimo se cierran tras 5 min sin uso (liberan cupo en Supabase).
spring.datasource.hikari.idle-timeout=300000
# Cada 4 min se comprueba cada conexión ociosa: así ni el pooler ni un cortafuegos la cierran por inactividad sin que la aplicación se entere.
spring.datasource.hikari.keepalive-time=240000
# Se renuevan cada 25 min (siempre por debajo de cualquier límite del servidor).
spring.datasource.hikari.max-lifetime=1500000

# Parámetros del driver PostgreSQL (se suman a los de la URL; sslmode=require sigue en DB_URL).
spring.datasource.hikari.data-source-properties.ApplicationName=SEVB
# Mantiene viva la conexión TCP (red doméstica, NAT o cortafuegos que descartan conexiones calladas).
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
# Plazo (segundos) para abrir la conexión y para autenticarse: sin esto una red caída puede dejar el arranque colgado.
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.loginTimeout=15
